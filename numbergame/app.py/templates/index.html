
<!DOCTYPE html>
<html lang="en">

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
            background: linear-gradient(135deg, #17133d, #5b21b6, #9333ea);
        }

        .game-card {
            width: 90%;
            max-width: 420px;
            padding: 35px 25px;
            text-align: center;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 24px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25);
        }

        .emoji {
            font-size: 55px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        p {
            color: #e9d5ff;
            line-height: 1.5;
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 18px 0 12px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #facc15;
            color: #241047;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #fde047;
            transform: translateY(-2px);
        }

        .message {
            margin-top: 22px;
            font-size: 18px;
            font-weight: bold;
            color: white;
        }

        .attempts {
            margin-top: 12px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="game-card">
        <div class="emoji">🎯</div>
        <h1>Number Guessing Game</h1>
        <p>I'm thinking of a number between 1 and 10!</p>

        <form method="POST">
            <input
                type="number"
                name="guess"
                min="1"
                max="10"
                placeholder="Enter your guess"
                required
            >
            <button type="submit">Guess Number 🚀</button>
        </form>

        <div class="message">{{ message }}</div>
        <div class="attempts">Attempts: {{ attempts }}</div>
    </div>
</body>
</html>
